<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAZ Harum Peduli</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="ikon-laz-192.png">
<link rel="apple-touch-icon" href="ikon-laz-192.png">
<meta name="theme-color" content="#7a2234">
<style>
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(150deg,#7a2234,#5a1826 60%,#a02f43);color:#fff;font-family:system-ui,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
img{width:96px;height:96px;border-radius:20px;background:#fff}
a{color:#fff}
button{display:none;background:#fff;color:#7a2234;border:0;border-radius:10px;padding:12px 20px;font-size:16px;font-weight:600;cursor:pointer}
</style></head><body>
<img src="ikon-laz-192.png" alt="LAZ Harum Peduli">
<div><b>LAZ Harum Peduli</b><br><span id="s">Membuka aplikasi...</span></div>
<button id="i" type="button">Pasang aplikasi</button>
<a id="l" href="#" style="display:none">Buka aplikasi</a>
<script>
var APP_URL = "GANTI_DENGAN_URL_EXEC";
var inst = location.search.indexOf("install") > -1;
var dp = null;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
var l = document.getElementById("l"), s = document.getElementById("s"), b = document.getElementById("i");
window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault(); dp = e;
  if (inst) { b.style.display = "inline-block"; s.textContent = "Klik Pasang aplikasi."; }
});
b.onclick = function () { if (dp) { dp.prompt(); } };
if (APP_URL.indexOf("https://script.google.com/") !== 0) {
  s.textContent = "Alamat aplikasi belum diisi. Ubah APP_URL di index.html.";
} else {
  l.href = APP_URL; l.style.display = "inline";
  if (inst) { s.textContent = "Mode pemasangan. Jika tombol Pasang aplikasi belum muncul, tunggu beberapa detik."; }
  else { setTimeout(function () { location.replace(APP_URL); }, 700); }
}
</script>
</body></html>
